<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本 47 都道府縣製霸圖</title>
    <!-- D3.js & TopoJSON -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --unvisited-color: #9e9e9e;
            --visited-color: #ffd54f;
            --hover-visited: #ffe082;
            --hover-unvisited: #bdbdbd;
            --border-color: #ffffff;
            --primary-color: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #64748b;
        }

        /* 統計面板 */
        .stats-card {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .counter-box {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .counter-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #d97706;
            margin: 0 4px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* 控制按鈕區 */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #475569;
        }

        .btn:hover {
            background: #f8fafc;
            border-color: #94a3b8;
            color: #1e293b;
        }

        .btn-reset {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }

        .btn-reset:hover {
            background: #fecaca;
            border-color: #f87171;
            color: #7f1d1d;
        }

        /* 地圖區域 */
        .map-container {
            position: relative;
            width: 100%;
            height: 600px;
            background: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .prefecture {
            fill: var(--unvisited-color);
            stroke: var(--border-color);
            stroke-width: 0.8;
            cursor: pointer;
            transition: fill 0.25s ease, stroke-width 0.2s ease;
        }

        .prefecture:hover {
            opacity: 0.85;
            stroke-width: 1.5;
            stroke: #475569;
        }

        .prefecture.visited {
            fill: var(--visited-color);
        }

        .pref-label {
            font-size: 10px;
            fill: #1e293b;
            font-weight: 600;
            pointer-events: none;
            text-anchor: middle;
            user-select: none;
            text-shadow: 0px 0px 2px rgba(255, 255, 255, 0.8);
        }

        /* Tooltip 浮動提示 */
        .tooltip {
            position: absolute;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            border-radius: 6px;
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* 載入中遮罩 */
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            color: #64748b;
            z-index: 20;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .map-container {
                height: 450px;
            }
            .pref-label {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🇯🇵 日本 47 都道府縣製霸圖</h1>
        <p class="subtitle">點擊地圖標記造訪足跡，記錄你的日本旅行記錄！</p>
    </header>

    <div class="stats-card">
        <div class="counter-box">
            已解鎖 <span id="visited-count" class="counter-number">0</span> / 47 都道府縣
            （<span id="visited-percent">0.0</span>%）
        </div>
        <div class="progress-bar-bg">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="selectRegion('hokkaido')">北海道</button>
        <button class="btn" onclick="selectRegion('tohoku')">東北</button>
        <button class="btn" onclick="selectRegion('kanto')">關東</button>
        <button class="btn" onclick="selectRegion('chubu')">中部</button>
        <button class="btn" onclick="selectRegion('kansai')">近畿</button>
        <button class="btn" onclick="selectRegion('chugoku')">中國</button>
        <button class="btn" onclick="selectRegion('shikoku')">四國</button>
        <button class="btn" onclick="selectRegion('kyushu')">九州/沖繩</button>
        <button class="btn btn-reset" onclick="clearAll()">一鍵重置</button>
    </div>

    <div class="map-container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>地圖載入中...</div>
        </div>
        <div id="tooltip" class="tooltip"></div>
        <svg id="japan-map"></svg>
    </div>
</div>

<script>
    // 47 都道府縣名稱與 ISO 代碼映射
    const prefNames = {
        1: "北海道", 2: "青森縣", 3: "岩手縣", 4: "宮城縣", 5: "秋田縣", 
        6: "山形縣", 7: "福島縣", 8: "茨城縣", 9: "栃木縣", 10: "群馬縣", 
        11: "埼玉縣", 12: "千葉縣", 13: "東京都", 14: "神奈川縣", 15: "新潟縣", 
        16: "富山縣", 17: "石川縣", 18: "福井縣", 19: "山梨縣", 20: "長野縣", 
        21: "岐阜縣", 22: "靜岡縣", 23: "愛知縣", 24: "三重縣", 25: "滋賀縣", 
        26: "京都府", 27: "大阪府", 28: "兵庫縣", 29: "奈良縣", 30: "和歌山縣", 
        31: "鳥取縣", 32: "島根縣", 33: "岡山縣", 34: "廣島縣", 35: "山口縣", 
        36: "德島縣", 37: "香川縣", 38: "愛媛縣", 39: "高知縣", 40: "福岡縣", 
        41: "佐賀縣", 42: "長崎縣", 43: "熊本縣", 44: "大分縣", 45: "宮崎縣", 
        46: "鹿兒島縣", 47: "沖繩縣"
    };

    // 區域劃分定義
    const regionPrefIds = {
        hokkaido: [1],
        tohoku: [2, 3, 4, 5, 6, 7],
        kanto: [8, 9, 10, 11, 12, 13, 14],
        chubu: [15, 16, 17, 18, 19, 20, 21, 22, 23],
        kansai: [24, 25, 26, 27, 28, 29, 30],
        chugoku: [31, 32, 33, 34, 35],
        shikoku: [36, 37, 38, 39],
        kyushu: [40, 41, 42, 43, 44, 45, 46, 47]
    };

    // 讀取 localStorage 已點選紀錄
    let visitedPrefs = new Set(JSON.parse(localStorage.getItem('japan_visited_prefs') || '[]'));

    const svg = d3.select("#japan-map");
    const tooltip = d3.select("#tooltip");

    // 設定地圖投影
    const projection = d3.geoMercator()
        .center([137.5, 37.5])
        .scale(1600);

    const path = d3.geoPath().projection(projection);

    // 載入 TopoJSON 地圖資料 (使用 CDN 託管的 Japan TopoJSON)
    fetch("https://raw.githubusercontent.com/deldersveld/topojson/master/countries/japan/japan-prefectures.json")
        .then(response => response.json())
        .then(topology => {
            document.getElementById("loading").style.display = "none";

            const geojson = topojson.feature(topology, topology.objects.japan);

            // 繪製各縣市區塊
            svg.selectAll("path")
                .data(geojson.features)
                .enter()
                .append("path")
                .attr("d", path)
                .attr("class", d => {
                    const id = parseInt(d.properties.id || d.id);
                    return visitedPrefs.has(id) ? "prefecture visited" : "prefecture";
                })
                .attr("data-id", d => parseInt(d.properties.id || d.id))
                .on("click", function(event, d) {
                    const id = parseInt(d.properties.id || d.id);
                    togglePrefectures([id]);
                })
                .on("mouseover", function(event, d) {
                    const id = parseInt(d.properties.id || d.id);
                    const name = prefNames[id] || d.properties.nam || "未知";
                    const status = visitedPrefs.has(id) ? " (已造訪)" : " (未造訪)";
                    tooltip.style("opacity", "1")
                           .html(`<strong>${name}</strong>${status}`);
                })
                .on("mousemove", function(event) {
                    const containerRect = document.querySelector('.map-container').getBoundingClientRect();
                    tooltip.style("left", (event.clientX - containerRect.left + 10) + "px")
                           .style("top", (event.clientY - containerRect.top - 25) + "px");
                })
                .on("mouseout", function() {
                    tooltip.style("opacity", "0");
                });

            // 繪製縣市名稱標籤
            svg.selectAll("text")
                .data(geojson.features)
                .enter()
                .append("text")
                .attr("class", "pref-label")
                .attr("transform", d => {
                    const centroid = path.centroid(d);
                    // 針對沖繩或離島位置可作微調，這裡使用 Centroid 計算中心點
                    return `translate(${centroid[0]}, ${centroid[1]})`;
                })
                .attr("dy", ".35em")
                .text(d => {
                    const id = parseInt(d.properties.id || d.id);
                    // 簡化顯示名稱 (例: 東京都 -> 東京)
                    const full = prefNames[id] || "";
                    return full.replace(/[都|府|縣]/g, '');
                });

            updateUI();
        })
        .catch(err => {
            console.error("地圖資料載入失敗:", err);
            document.getElementById("loading").innerHTML = "<div style='color:red;'>地圖資料載入失敗，請檢查網路連線。</div>";
        });

    // 切換指定縣市的解鎖狀態
    function togglePrefectures(ids) {
        ids.forEach(id => {
            if (visitedPrefs.has(id)) {
                visitedPrefs.delete(id);
            } else {
                visitedPrefs.add(id);
            }
        });

        // 儲存至 LocalStorage
        localStorage.setItem('japan_visited_prefs', JSON.stringify(Array.from(visitedPrefs)));

        // 更新視圖
        svg.selectAll(".prefecture")
            .classed("visited", function() {
                const id = parseInt(d3.select(this).attr("data-id"));
                return visitedPrefs.has(id);
            });

        updateUI();
    }

    // 按區域選取
    function selectRegion(regionKey) {
        const ids = regionPrefIds[regionKey];
        if (!ids) return;

        // 檢查該區域是否全部已選取，若是則全部取消，否則全部選取
        const allSelected = ids.every(id => visitedPrefs.has(id));
        
        ids.forEach(id => {
            if (allSelected) {
                visitedPrefs.delete(id);
            } else {
                visitedPrefs.add(id);
            }
        });

        localStorage.setItem('japan_visited_prefs', JSON.stringify(Array.from(visitedPrefs)));
        
        svg.selectAll(".prefecture")
            .classed("visited", function() {
                const id = parseInt(d3.select(this).attr("data-id"));
                return visitedPrefs.has(id);
            });

        updateUI();
    }

    // 重置所有紀錄
    function clearAll() {
        if (confirm("確定要重置所有已標記的縣市嗎？")) {
            visitedPrefs.clear();
            localStorage.removeItem('japan_visited_prefs');
            svg.selectAll(".prefecture").classed("visited", false);
            updateUI();
        }
    }

    // 更新 UI 數據統計與進度條
    function updateUI() {
        const count = visitedPrefs.size;
        const percent = ((count / 47) * 100).toFixed(1);
        
        document.getElementById("visited-count").textContent = count;
        document.getElementById("visited-percent").textContent = percent;
        document.getElementById("progress-fill").style.width = percent + "%";
    }
</script>

</body>
</html>
